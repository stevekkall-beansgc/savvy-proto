name: savvy-release-check
services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: savvy_demo
      POSTGRES_DB: advisor_economics_synthetic_test
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [release_test_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U savvy_demo -d advisor_economics_synthetic_test']
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /work/apps/api
    environment:
      PGHOST: db
      PGUSER: savvy_demo
      RAILS_ENV: test
      SYNTHETIC_DEMO: '1'
    volumes: ['.:/work']
    depends_on:
      db:
        condition: service_healthy
volumes:
  release_test_data: {}
networks:
  default:
    ipam:
      config:
        - subnet: 10.219.216.0/24
