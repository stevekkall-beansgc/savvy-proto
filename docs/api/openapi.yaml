openapi: 3.1.1
info:
  title: Savvy billing prototype API
  version: 0.8.0
  description: Current synthetic Rails/GraphQL implementation. Savvy owns billing obligations, invoices/lines and
    custodial instructions. One Economics::Engine evaluates policy data. Campfire and CLM remain mocked. The API
    reference is static. Hosted sample reads need no sign-in. Hosted mutations require an active isolated demo workspace.
    X-Demo-Role selects a simulated role.
servers:
- url: https://savvy-proto.beanshop.top
  description: Public device-hosted synthetic demo. Prepared queries need no sign-in.
- url: http://127.0.0.1:3100
  description: Fresh-clone Next.js frontend on loopback.
externalDocs:
  description: Authoritative GraphQL SDL in the repository
  url: https://github.com/stevekkall-beansgc/savvy-proto/blob/dbcca40ad9b9f1479976ed643b1f5e2af6a4f546/contracts/schema.graphql
tags:
- name: GraphQL transport
- name: Local service
paths:
  /api/graphql:
    post:
      summary: Execute GraphQL queries or commands
      operationId: executeGraphQL
      tags:
      - GraphQL transport
      description: GraphQL POST envelope. Query and Mutation fields are enumerated in x-graphql-operations and in
        the downloadable authoritative SDL. No REST resources, MCP endpoint or WebMCP registration are implemented
        by this document. All fixtures are synthetic; integrations remain mocked. This reference does not send live
        requests.
      parameters:
      - name: X-Demo-Role
        in: header
        required: false
        description: Selects a simulated workspace role and defaults to operator. Hosted mutations also require
          an active isolated demo workspace.
        schema:
          type: string
          enum:
          - advisor
          - ria
          - operator
          - finance
          - legal
          - auditor
          default: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            examples:
              householdRead:
                summary: Read February household billing
                value: &id006
                  query: 'query DisclosureWorkspace($audience: String!, $caseId: ID!, $limit: Int, $offset: Int,
                    $pageChanges: Boolean) { disclosureWorkspace(audience: $audience, caseId: $caseId, limit: $limit,
                    offset: $offset, pageChanges: $pageChanges) }'
                  variables:
                    audience: client
                    caseId: advisor
                    limit: 100
                    offset: 0
                    pageChanges: true
              saveDraftPolicy:
                summary: Save a draft; does not activate or bill
                value: &id007
                  query: 'mutation DisclosureCommand($action: String!, $idempotencyKey: String!, $input: JSON!)
                    { disclosureCommand(action: $action, idempotencyKey: $idempotencyKey, input: $input) { data
                    errors { code message path } } }'
                  variables:
                    action: SAVE_POLICY
                    input:
                      case_id: advisor
                      base_policy_id: disclosure-policy-v1
                      policy:
                        basis: ending_value
                        cadence: monthly
                        annual_rate: 33/2500
                        minimum_minor: null
                        fixed_amount_minor: null
                        optional_service: none
                      effective_from: '2027-02-01'
                      effective_to: '2027-03-01'
                      reason: Compare a proposed annual rate
                    idempotencyKey: docs-save-policy-001
              submitPayoutRequest:
                summary: Draft September payout request; does not execute payment
                value: &id008
                  query: 'mutation MedallionCommand($action: MedallionCommand!, $idempotencyKey: String!, $input:
                    JSON!) { medallionCommand(action: $action, idempotencyKey: $idempotencyKey, input: $input) {
                    data errors { code message path } } }'
                  variables:
                    action: SUBMIT_EVENT
                    input:
                      case_id: advisor
                      scenario_id: baseline
                      event:
                        id: docs-payout-request-001
                        revision: 1
                        kind: payout_request
                        amount_minor: '25000'
                        currency: USD
                        debtor_id: firm-demo
                        creditor_id: advisor-demo
                        subject_id: advisor-demo
                        reason: Request a one-time advisor payout
                        economic_date: '2026-09-15'
                        posting_period: 2026-09
                        policy_id: advisor-policy-v1
                    idempotencyKey: docs-submit-event-001
      responses:
        '200':
          description: GraphQL result, possibly containing top-level or nested domain errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '400':
          description: Malformed JSON or invalid GraphQL envelope forwarded by Rails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '403':
          description: Origin or simulated identity rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Rails service error or invalid local API proxy configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '413':
          description: Request body exceeds the transport limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '503':
          description: Next proxy cannot reach its loopback Rails API or the request times out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
      security:
      - {}
      - DemoWorkspaceSession: []
      x-hosted-access: Prepared synthetic queries are public. Hosted mutations require an active demo workspace.
        Choose Start your own demo in the working app to create a workspace. The browser sends the workspace cookie
        and the server scopes changes to that workspace.
      x-limits:
        proxy_body_character_limit: 1048576
        rails_body_utf8_byte_limit: 1048576
        graphql_document_utf8_byte_limit: 50000
        graphql_max_depth: 10
        graphql_max_complexity: 150
  /graphql:
    servers: &id001
    - url: http://127.0.0.1:3101
      description: Fresh-clone Rails API on loopback.
    - url: http://127.0.0.1:3108
      description: Device-hosted Rails API slot A on loopback.
    - url: http://127.0.0.1:3109
      description: Device-hosted Rails API slot B on loopback.
    post:
      summary: Execute GraphQL directly on the loopback Rails API
      operationId: executeLocalGraphQL
      tags:
      - GraphQL transport
      description: GraphQL POST envelope. Query and Mutation fields are enumerated in x-graphql-operations and in
        the downloadable authoritative SDL. No REST resources, MCP endpoint or WebMCP registration are implemented
        by this document. All fixtures are synthetic; integrations remain mocked. This reference does not send live
        requests.
      parameters:
      - name: X-Demo-Role
        in: header
        required: false
        description: Selects a simulated workspace role and defaults to operator. Hosted mutations also require
          an active isolated demo workspace.
        schema:
          type: string
          enum:
          - advisor
          - ria
          - operator
          - finance
          - legal
          - auditor
          default: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            examples:
              householdRead:
                summary: Read February household billing
                value:
                  query: 'query DisclosureWorkspace($audience: String!, $caseId: ID!, $limit: Int, $offset: Int,
                    $pageChanges: Boolean) { disclosureWorkspace(audience: $audience, caseId: $caseId, limit: $limit,
                    offset: $offset, pageChanges: $pageChanges) }'
                  variables:
                    audience: client
                    caseId: advisor
                    limit: 100
                    offset: 0
                    pageChanges: true
              saveDraftPolicy:
                summary: Save a draft; does not activate or bill
                value:
                  query: 'mutation DisclosureCommand($action: String!, $idempotencyKey: String!, $input: JSON!)
                    { disclosureCommand(action: $action, idempotencyKey: $idempotencyKey, input: $input) { data
                    errors { code message path } } }'
                  variables:
                    action: SAVE_POLICY
                    input:
                      case_id: advisor
                      base_policy_id: disclosure-policy-v1
                      policy:
                        basis: ending_value
                        cadence: monthly
                        annual_rate: 33/2500
                        minimum_minor: null
                        fixed_amount_minor: null
                        optional_service: none
                      effective_from: '2027-02-01'
                      effective_to: '2027-03-01'
                      reason: Compare a proposed annual rate
                    idempotencyKey: docs-save-policy-001
              submitPayoutRequest:
                summary: Draft September payout request; does not execute payment
                value:
                  query: 'mutation MedallionCommand($action: MedallionCommand!, $idempotencyKey: String!, $input:
                    JSON!) { medallionCommand(action: $action, idempotencyKey: $idempotencyKey, input: $input) {
                    data errors { code message path } } }'
                  variables:
                    action: SUBMIT_EVENT
                    input:
                      case_id: advisor
                      scenario_id: baseline
                      event:
                        id: docs-payout-request-001
                        revision: 1
                        kind: payout_request
                        amount_minor: '25000'
                        currency: USD
                        debtor_id: firm-demo
                        creditor_id: advisor-demo
                        subject_id: advisor-demo
                        reason: Request a one-time advisor payout
                        economic_date: '2026-09-15'
                        posting_period: 2026-09
                        policy_id: advisor-policy-v1
                    idempotencyKey: docs-submit-event-001
      responses:
        '200':
          description: GraphQL result, possibly containing top-level or nested domain errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '400':
          description: Malformed JSON or invalid GraphQL envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '403':
          description: Origin or simulated identity rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Unhandled local service error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '413':
          description: Request body exceeds the transport limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
      security: []
      x-limits:
        proxy_body_character_limit: 1048576
        rails_body_utf8_byte_limit: 1048576
        graphql_document_utf8_byte_limit: 50000
        graphql_max_depth: 10
        graphql_max_complexity: 150
  /health:
    servers: *id001
    get:
      operationId: localHealth
      summary: Inspect local synthetic service health
      tags:
      - Local service
      security: []
      responses:
        '200':
          description: Current local service metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                  synthetic:
                    const: true
                  connected:
                    const: false
                  contract_version:
                    type: string
                  engine_version:
                    type: string
                  source_revision:
                    type: string
                  immutable_preview:
                    type: boolean
                  eager_load:
                    type: boolean
                  reloading_enabled:
                    type: boolean
                required:
                - status
                - synthetic
                - connected
                - contract_version
                - engine_version
components:
  securitySchemes:
    DemoWorkspaceSession:
      type: apiKey
      in: cookie
      name: savvy_demo_session
      description: HTTP-only cookie set by Start your own demo. Required for hosted mutations and used to scope
        reads to an active workspace. Anonymous queries use the prepared sample.
  schemas:
    GraphQLRequest:
      type: object
      properties:
        query:
          type: string
          description: GraphQL document, maximum 50,000 UTF-8 bytes at Rails.
        variables:
          type:
          - object
          - 'null'
          additionalProperties: true
        operationName:
          type:
          - string
          - 'null'
      required:
      - query
    GraphQLError:
      type: object
      properties:
        message:
          type: string
        path:
          type: array
          items:
            type:
            - string
            - integer
        extensions:
          type: object
          properties:
            code:
              type: string
          additionalProperties: true
        locations:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              column:
                type: integer
      required:
      - message
      additionalProperties: true
    GraphQLResponse:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLError'
        extensions:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: HTTP 200 may contain top-level GraphQL errors. Command domain errors are nested in data.<command>.errors;
        inspect both before accepting a write.
    HttpError:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLError'
      additionalProperties: true
    DomainError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: array
          items:
            type: string
      required:
      - code
      - message
      - path
    CommandResult:
      type: object
      properties:
        data: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/DomainError'
        run: {}
      required:
      - errors
      description: Command-specific data is a GraphQL JSON scalar. Run is optionally selected on Payload. Empty
        errors alone does not establish cash execution or accounting recognition.
    MinorUnits: &id002
      type: string
      description: Exact minor units as a decimal integer string; unknown amounts are null, not zero.
      pattern: ^-?[0-9]+$
    IdempotencyKey:
      type: string
      description: Scoped by actor, command and tenant/entity. Reuse only for the identical input.
      pattern: ^[a-zA-Z0-9_-]{1,100}$
    HouseholdPolicy:
      type: object
      properties:
        basis:
          enum:
          - ending_value
          - average_daily_balance
          - net_worth
          - fixed
          - hourly
          - optional_service
        cadence:
          enum:
          - monthly
          - quarterly
        annual_rate:
          type:
          - string
          - 'null'
          maxLength: 40
          pattern: ^\d+(?:/[1-9]\d*)?$
          description: Exact nonnegative rational fraction, e.g. 3/250 = 1.2% annually. Accepted combinations are
            validated by DisclosurePolicy.
        minimum_minor:
          anyOf:
          - *id002
          - type: 'null'
        fixed_amount_minor:
          anyOf:
          - *id002
          - type: 'null'
        hourly_rate_minor:
          anyOf:
          - *id002
          - type: 'null'
        optional_amount_minor:
          anyOf:
          - *id002
          - type: 'null'
        optional_service:
          enum:
          - none
          - accepted
        service_mode:
          enum:
          - full
          - partial
          - null
      required:
      - basis
      - cadence
      - optional_service
      additionalProperties: false
      description: Named household policy treatments. Monthly ending value supports a group minimum; other bases
        require their matching source evidence. Unsupported field combinations fail validation. The policy graph
        is data; Economics::Engine performs all arithmetic.
    SavePolicyInput:
      type: object
      properties:
        case_id:
          const: advisor
        base_policy_id:
          type: string
        policy:
          $ref: '#/components/schemas/HouseholdPolicy'
        effective_from: &id003
          type: string
          description: API end dates are exclusive; UI last-day dates are inclusive.
          format: date
        effective_to:
          anyOf:
          - *id003
          - type: 'null'
        reason:
          type: string
      required:
      - case_id
      - base_policy_id
      - policy
      - effective_from
      - effective_to
      - reason
      additionalProperties: false
    ComparePolicyInput:
      type: object
      properties:
        case_id:
          const: advisor
        policy_id:
          type: string
        baseline_run_id:
          type: string
      required:
      - case_id
      - policy_id
      - baseline_run_id
      additionalProperties: false
    ReviewPolicyInput:
      type: object
      properties:
        case_id:
          const: advisor
        comparison_id:
          type: string
        decision:
          enum:
          - approve
          - reject
        reason:
          type: string
      required:
      - case_id
      - comparison_id
      - decision
      - reason
      additionalProperties: false
    PublishPolicyInput:
      type: object
      properties:
        case_id:
          const: advisor
        policy_id:
          type: string
        comparison_id:
          type: string
      required:
      - case_id
      - policy_id
      - comparison_id
      additionalProperties: false
    AssignPolicyInput:
      type: object
      properties:
        case_id:
          const: advisor
        policy_id:
          type: string
        subject_id:
          const: disclosure-alder-household
        effective_from: *id003
        effective_to: *id003
        reason:
          type: string
        supersedes_assignment_id:
          type: string
      required:
      - case_id
      - policy_id
      - subject_id
      - effective_from
      - effective_to
      - reason
      additionalProperties: false
    EvaluateInput:
      type: object
      properties:
        case_id:
          const: advisor
        knowledge_cutoff:
          type: string
          format: date-time
      required:
      - case_id
      - knowledge_cutoff
      additionalProperties: false
    OneTimeEvent:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        kind:
          enum:
          - one_time_charge
          - one_time_credit
          - compensation_entitlement
          - payout_request
        amount_minor: &id005
          type: string
          description: Exact minor units as a decimal integer string; unknown amounts are null, not zero.
          pattern: ^[1-9][0-9]*$
        currency:
          const: USD
        debtor_id:
          type: string
        creditor_id:
          type: string
        subject_id:
          type: string
        reason:
          type: string
        economic_date: *id003
        posting_period:
          type: string
          pattern: ^\d{4}-\d{2}$
        policy_id:
          type: string
        event_policy_id:
          type: string
        original_id:
          type: string
        original_revision:
          type: integer
          minimum: 1
        original_hash:
          type: string
        reason_code:
          type: string
      required:
      - id
      - revision
      - kind
      - amount_minor
      - currency
      - debtor_id
      - creditor_id
      - subject_id
      - reason
      - economic_date
      - posting_period
      - policy_id
      additionalProperties: false
      description: Baseline September 2026 event input. Advisor supports compensation_entitlement and payout_request,
        firm-demo → advisor-demo. RIA supports one_time_charge (ria-harbor → firm-demo) and one_time_credit (reverse
        direction). Amount is positive; kind and parties carry direction. Non-payout items need a published event_policy_id.
        Revisions must bind original identity/revision/hash.
    SubmitEventInput:
      type: object
      properties:
        case_id: &id004
          type: string
          enum:
          - advisor
          - ria
        scenario_id:
          type: string
          default: baseline
        event:
          $ref: '#/components/schemas/OneTimeEvent'
      required:
      - case_id
      - event
    ReviewEventInput:
      type: object
      properties:
        case_id: *id004
        scenario_id:
          type: string
          default: baseline
        event_id:
          type: string
        revision:
          type: integer
          minimum: 1
        expected_hash:
          type: string
        decision:
          enum:
          - approved
          - rejected
      required:
      - case_id
      - event_id
      - revision
      - expected_hash
      - decision
    CashAssociationInput:
      type: object
      properties:
        payment_id:
          type: string
        invoice_id:
          type: string
        currency:
          const: USD
        amount_minor: *id005
        posting_period:
          type: string
          pattern: ^\d{4}-\d{2}$
        reason:
          type: string
      required:
      - payment_id
      - invoice_id
      - currency
      - amount_minor
      - posting_period
      - reason
      additionalProperties: false
    CashReversalInput:
      type: object
      properties:
        application_id:
          type: string
        reason:
          type: string
        posting_period:
          type: string
          pattern: ^\d{4}-\d{2}$
      required:
      - application_id
      - reason
      - posting_period
      additionalProperties: false
    SharedPolicy:
      type: object
      properties:
        version:
          type: string
        allocation:
          enum:
          - equal
          - balance
        purpose:
          enum:
          - billing
          - earnings
        invoice_timing:
          enum:
          - advance
          - arrears
        components:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                enum:
                - aum
                - flat
                - per_account
                - hourly
                - events
                - observation
                - earned_share
            required:
            - id
            - kind
            additionalProperties: true
        graph:
          type: object
          description: Validated typed primitive graph; mandatory assessed USD charge obligation and source requirements.
        input_requirements:
          type: object
        minimum_minor: *id002
        cap_minor: *id002
        compensation:
          type: object
      required:
      - version
      additionalProperties: false
      description: Use components OR graph. Kind-specific field validation is enforced by BillingPolicy. AUM supports
        annual rate, dated standard/promotion/targeted rates or progressive tiers. Observation outputs stay separate
        from invoices. Only approved typed operators execute; no source code is accepted.
    SourceMapping:
      type: object
      properties:
        format:
          enum:
          - json
          - ndjson
        records_path:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        constants:
          type: object
        coercions:
          type: object
          additionalProperties:
            enum:
            - integer
            - decimal_usd
            - rational_decimal
            - boolean
            - us_date
            - epoch_seconds
            - identifier
            - string
      required:
      - format
      - fields
      additionalProperties: false
      description: Versioned canonical field mappings. Original bytes are retained before parsing; binary or invalid
        input is quarantined. Registering a new version requires replay before normalized records become current.
    SharedRegisterSourceInput:
      type: object
      properties:
        name:
          type: string
        mapping:
          $ref: '#/components/schemas/SourceMapping'
      required:
      - name
      - mapping
      additionalProperties: false
    SharedIngestInput:
      type: object
      properties:
        source_id:
          type: string
        delivery_key:
          type: string
        raw:
          type: string
        raw_base64:
          type: string
        defer:
          type: boolean
        run_at:
          type: string
          format: date-time
      required:
      - source_id
      - delivery_key
      - raw
      additionalProperties: false
    SharedReplayInput:
      type: object
      properties:
        delivery_id:
          type: string
        source_id:
          type: string
      required:
      - delivery_id
      - source_id
      additionalProperties: false
    SharedSavePolicyInput:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/SharedPolicy'
        effective_from: *id003
        effective_to:
          anyOf:
          - *id003
          - type: 'null'
        reason:
          type: string
      required:
      - policy
      - effective_from
      - effective_to
      - reason
      additionalProperties: false
    SharedComparePolicyInput:
      type: object
      properties:
        policy_id:
          type: string
        baseline_policy_id:
          type: string
        subject_id:
          type: string
        service_start: *id003
        service_end_exclusive: *id003
      required:
      - policy_id
      - subject_id
      - service_start
      - service_end_exclusive
      additionalProperties: false
    SharedReviewPolicyInput:
      type: object
      properties:
        comparison_id:
          type: string
        decision:
          enum:
          - approved
          - rejected
        reason:
          type: string
        document_ref:
          type: object
          properties:
            system:
              const: mock_clm
            document_id:
              type: string
            version:
              type: string
          required:
          - system
          - document_id
          - version
          additionalProperties: false
      required:
      - comparison_id
      - decision
      - reason
      - document_ref
      additionalProperties: false
    SharedPublishPolicyInput:
      type: object
      properties:
        comparison_id:
          type: string
      required:
      - comparison_id
      additionalProperties: false
    SharedAssignPolicyInput:
      type: object
      properties:
        policy_id:
          type: string
        subject_id:
          type: string
        effective_from: *id003
        effective_to: *id003
        reason:
          type: string
        expected_schedule_hash:
          type: string
      required:
      - policy_id
      - subject_id
      - effective_from
      - effective_to
      - reason
      - expected_schedule_hash
      additionalProperties: false
    SharedEvaluateInput:
      type: object
      properties:
        subject_id:
          type: string
        service_start: *id003
        service_end_exclusive: *id003
        purpose:
