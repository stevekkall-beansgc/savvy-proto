type BrokerBook {
  completeness: String!
  coverage: Money
  customers: JSON!
  earned: Money
  id: ID!
  incrementalCash: Money
  name: String!
}

enum Command {
  ACTIVATE
  CLOSE_RECONCILIATION
  COMPARE_TERMS_PROPOSAL
  CONSUME_ENTITLEMENT
  IMPORT_SNAPSHOT
  LINK_INVOICE
  MATCH
  PROJECT
  RECORD_BANK_BATCH
  RECORD_INVOICE_APPLICATION
  REVERSE_BANK_BATCH
  REVERSE_ENTITLEMENT
  REVERSE_INVOICE_APPLICATION
  REVERSE_MATCH
  REVERSE_RECEIPT
  REVIEW
  REVIEW_TERMS_PROPOSAL
  SAVE_POLICY
  SAVE_TERMS_PROPOSAL
  SCHEDULE_TERMS_PROPOSAL
}

type DomainError {
  code: String!
  message: String!
  path: [String!]!
}

enum FinanceCommand {
  FINANCE_ASSOCIATE
  FINANCE_BOOTSTRAP
  FINANCE_MOCK_ACKNOWLEDGE
  FINANCE_REVERSE
}

"""
Represents untyped JSON
"""
scalar JSON

enum MedallionCommand {
  APPLY_PAYMENT
  ASSIGN_POLICY
  BOOTSTRAP
  COMPARE_POLICIES
  EVALUATE_CASE
  INGEST_DELIVERY
  LOCK_POSTING_PERIOD
  PUBLISH_POLICY
  RECORD_PAYMENT
  REVERSE_FUNDING
  REVERSE_PAYMENT_APPLICATION
  REVERSE_SOURCE_RECEIPT
  REVIEW_EVENT
  REVIEW_POLICY
  SAVE_POLICY_VERSION
  SEAL_STATEMENT
  SUBMIT_EVENT
}

type Money {
  currency: String!
  minorUnits: String!
}

type Mutation {
  disclosureCommand(action: String!, idempotencyKey: String!, input: JSON!): Payload!
  financeCommand(action: FinanceCommand!, idempotencyKey: String!, input: JSON!): Payload!
  medallionCommand(action: MedallionCommand!, idempotencyKey: String!, input: JSON!): Payload!
  workbenchCommand(action: Command!, idempotencyKey: String!, input: JSON!): Payload!
}

type Payload {
  data: JSON
  errors: [DomainError!]!
  run: Run
}

type Query {
  disclosureWorkspace(audience: String!, caseId: ID!, limit: Int, offset: Int, pageChanges: Boolean): JSON!
  audienceClient(caseId: ID!, clientId: ID!, limit: Int, offset: Int): JSON!
  audienceClients(caseId: ID!, limit: Int, offset: Int, search: String): JSON!
  audienceStatement(caseId: ID!, limit: Int, offset: Int): JSON!
  audienceSummary(caseId: ID!): JSON!
  brokerBook(brokerId: ID!, runId: ID): BrokerBook
  collections(customerId: ID, knowledgeCutoff: String): JSON!
  entitlementLedger(brokerId: ID): JSON!
  financeWorkspace(caseId: ID!): JSON!
  lineageRecord(caseId: ID!, limit: Int, offset: Int, recordId: ID!): JSON!
  lineageRecords(caseId: ID!, limit: Int, offset: Int, search: String): JSON!
  medallionWorkspace(caseId: ID!, limit: Int, offset: Int, runId: ID, scenarioId: ID, workspace: String!): JSON!
  productWorkspace(brokerId: ID, businessDate: String, workspace: String!): JSON!
  reconciliation(closeId: ID, periodEndExclusive: String!, periodStart: String!): JSON!
  reviewPacket(runId: ID!): JSON
  run(id: ID!): Run
  workbench: JSON!
}

type Run {
  businessDate: String!
  data: JSON!
  id: ID!
  inputManifestHash: String!
  knowledgeCutoff: String!
  policyHash: String!
  status: String!
}
